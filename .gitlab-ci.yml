image: docker.uib.gmbh/opsi/dev/pybuilder:uib-python-default

stages:
  - build
  - test

build_package:
  stage: build
  script:
    - packageVersion=$(opsi-dev-cli opsi-package get-value packageVersion)
    - opsi-dev-cli binary pull
    - '[ "$CI_COMMIT_TAG" = "" ] && opsi-dev-cli opsi-package set-value packageVersion "$packageVersion.$CI_JOB_ID"'
    - opsi-cli package make
    - upload-package *.opsi

test_tagged:
  stage: test
  script:
    - opsi-dev-cli -l info jenkins test
  only:
    - tags

test_tagged_manual:
  stage: test
  script:
    - opsi-dev-cli -l info jenkins test
  when: manual
